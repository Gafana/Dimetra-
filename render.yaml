services:
  - type: web
    name: dimetra-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: TZ
        value: Europe/Moscow
      - key: PROMO_CODE_PEPPER
        sync: false
      - key: PROMO_ADMIN_IDS
        sync: false
